# vsftpd - конфигурация на офисния FTP сървър
listen=YES
listen_ipv6=NO
background=YES

# Достъп само с потребителски акаунт (без анонимен достъп)
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Потребителите са заключени в домашната си директория
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty

ftpd_banner=Welcome to Office FTP server
pam_service_name=vsftpd

# Пасивен режим
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

# Логове
xferlog_enable=YES
xferlog_std_format=NO
vsftpd_log_file=/var/log/vsftpd.log

# Настройки, нужни за работа в контейнер
seccomp_sandbox=NO
isolate=NO
isolate_network=NO
