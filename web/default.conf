# nginx - вътрешен уеб портал на офиса
server {
    listen 80;
    server_name www.office.local web.office.local localhost;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/office_access.log;
    error_log  /var/log/nginx/office_error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }

    # Статистика на nginx (достъпна само от офисната мрежа)
    location /nginx_status {
        stub_status;
        allow 10.10.0.0/24;
        allow 127.0.0.1;
        deny  all;
    }
}
